name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.5.1
  SUI_VERSION: 1.82.1

jobs:
  schemas:
    name: Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Meta-validate every JSON Schema
        run: |
          python - <<'PY'
          import json, pathlib
          from jsonschema import Draft202012Validator
          for p in sorted(pathlib.Path("schemas").glob("*.schema.json")):
              Draft202012Validator.check_schema(json.loads(p.read_text()))
              print("valid schema:", p)
          json.loads(pathlib.Path("schemas/reasons-v1.json").read_text())
          print("parses: schemas/reasons-v1.json")
          PY

  conformance:
    name: Conformance vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../requirements.txt
      - run: python -m otas_tools.cli validate-all
      - run: python -m otas_tools.cli lint-reasons
      - run: python -m otas_tools.cli run-vectors

  demo:
    name: Simulated DvP demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python demo/run_demo.py
      - name: Reconcile the demo's event log
        working-directory: tools
        run: python -m otas_tools.cli reconcile ../demo/event_log.json

  evm:
    name: EVM contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Forge tests
        working-directory: live/evm
        run: forge test -vv
